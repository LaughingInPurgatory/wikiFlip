; WikiFlip PHP runtime tuning (Docker)
; Uploads aligned with app 30 MB max; compression + realpath/opcache for speed

file_uploads = On
upload_max_filesize = 30M
post_max_size = 50M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Output compression (text/HTML)
zlib.output_compression = On
zlib.output_compression_level = 5

; Filesystem path resolution cache (helps nested pages/ tree)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; OPcache — big win for PHP app code (not content.md)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
